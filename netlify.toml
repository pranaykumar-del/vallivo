[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,CASHFREE_APP_ID,CASHFREE_SECRET_KEY"

[[redirects]]
  from = "/api/create-cashfree-order"
  to = "/.netlify/functions/create-cashfree-order"
  status = 200

[[redirects]]
  from = "/api/verify-cashfree-order"
  to = "/.netlify/functions/verify-cashfree-order"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
